spring:
  application:
    name: barberflow-api

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/barberflow}
    username: ${POSTGRES_USER:barberflow}
    password: ${POSTGRES_PASSWORD:change-me-local-only}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    root: INFO

barberflow:
  # Tenant do MVP (uma barbearia no lancamento); usado pelo bootstrap do auth
  default-tenant-slug: ${BARBERSHOP_DEFAULT_TENANT_SLUG:barbearia-piloto}
  default-tenant-name: ${BARBERSHOP_DEFAULT_TENANT_NAME:Barbearia Piloto}
  default-tenant-timezone: ${BARBERSHOP_DEFAULT_TIMEZONE:America/Sao_Paulo}
  auth:
    # HS256, minimo de 32 bytes; troque em producao via variavel de ambiente
    jwt-secret: ${AUTH_JWT_SECRET:dev-secret-change-me-32-bytes-minimum!!}
    jwt-ttl-minutes: ${AUTH_JWT_TTL_MINUTES:720}
  availability:
    # Politicas do motor de disponibilidade (spec, secao 7.8)
    slot-step-minutes: ${AVAILABILITY_SLOT_STEP_MINUTES:15}
    min-lead-minutes: ${AVAILABILITY_MIN_LEAD_MINUTES:0}
  waitlist:
    # Validade da oferta de horario (spec, secao 9.2.4: "uma pessoa por vez")
    offer-ttl-minutes: ${WAITLIST_OFFER_TTL_MINUTES:5}
  ratelimit:
    # Limites por IP em janela deslizante de 60s (spec, linhas 180-188;
    # single-instance no MVP, Redis distribuido na Fase 4)
    public-read-per-minute: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:60}
    public-write-per-minute: ${RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE:20}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  whatsapp:
    # Cloud API (spec, secao 12): habilitado apenas com credenciais reais;
    # desabilitado, o worker marca eventos SENT via client de log (local)
    enabled: ${WHATSAPP_ENABLED:false}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    # Ciclo de polling da outbox (worker) e backoff inicial de retry
    poll-interval-millis: ${WHATSAPP_POLL_INTERVAL_MILLIS:15000}
    first-backoff-seconds: ${WHATSAPP_FIRST_BACKOFF_SECONDS:30}
