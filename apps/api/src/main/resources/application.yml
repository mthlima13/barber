spring:
  application:
    name: barberflow-api

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/barberflow}
    username: ${POSTGRES_USER:barberflow}
    password: ${POSTGRES_PASSWORD:change-me-local-only}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    root: INFO

barberflow:
  # Tenant do MVP (uma barbearia no lancamento); substituido pelo auth quando existir
  default-tenant-slug: ${BARBERSHOP_DEFAULT_TENANT_SLUG:barbearia-piloto}
