# BarberFlow — CI: testes da API (PostgreSQL real via Testcontainers) e
# build do web. Roda em push para main e em pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers requer Docker — disponivel nos runners do GitHub
      - name: Testes de integracao
        working-directory: apps/api
        run: mvn -B -ntp verify

  web:
    name: Web (next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
